name: wacrm

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* vars are inlined at build time — forward them
      # from .env.local as build args. Changing any of them requires
      # a rebuild (docker compose up --build).
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        # No `:-` default here: an empty value is exactly what the
        # image's build guard rejects, so let it through and fail loudly.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_LOCALE: ${NEXT_PUBLIC_APP_LOCALE:-en}
    # Runtime (server-only) secrets come from .env.local; they are
    # never baked into the image.
    env_file:
      - .env.local
    # The server always listens on 3000 inside the container. Pinned
    # here because `environment` wins over `env_file`, so a stray PORT
    # in .env.local can't desync the app from the mapping and the
    # healthcheck below.
    environment:
      PORT: 3000
    # Host side only — HOST_PORT=8080 publishes the app on :8080.
    ports:
      - '${HOST_PORT:-3000}:3000'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then((r)=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── El agente (Claudia) ─────────────────────────────────────
  # Vive en agente/ y es un proceso aparte, en Python. No se fusiona con
  # la app: el agente encadena llamadas al modelo y a NetSuite que tardan
  # segundos, y meterlas dentro del CRM bloquearia peticiones de la
  # bandeja mientras piensa.
  #
  # Se comunica con el CRM por su API publica, igual que lo haria desde
  # otra maquina. `WACRM_URL` apunta al servicio `app` por su nombre de
  # red interna, asi que no necesita salir a internet ni depender del DNS
  # publico — que en esta red no vuelve por falta de hairpin NAT.
  agente:
    build:
      context: ./agente
    env_file:
      - agente/.env
    environment:
      # Gana sobre lo que diga agente/.env: dentro de la red de Docker el
      # CRM se llama `app`, no su dominio publico.
      WACRM_URL: http://app:3000
    volumes:
      # Los datos viven en el host, no en la imagen. Sin esto el agente
      # arranca con memoria vacia y SIN CATALOGO: netsuite_sync.db son
      # 2.5 MB de productos que no estan en el repo (llevan datos de
      # clientes), asi que la imagen se construye sin ellos y el agente
      # no puede cotizar nada. No falla al arrancar; falla cuando un
      # cliente pregunta un precio.
      - ./agente/agentkit.db:/app/agentkit.db
      - ./agente/netsuite_sync.db:/app/netsuite_sync.db
      - ./agente/config:/app/config
      - ./agente/knowledge:/app/knowledge
      - ./agente/transcripts:/app/transcripts
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
